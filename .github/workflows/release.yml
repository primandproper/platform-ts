name: Release

on:
  push:
    branches: [main]

# Don't run two version/publish passes at once.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write # push the "version packages" PR branch + git tags
  pull-requests: write # open/update the "version packages" PR
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets needs full history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # OIDC trusted publishing needs Node >= 22.14
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 still ships npm 10.
      # `changeset publish` shells out to this npm, so upgrading it is enough.
      - name: Upgrade npm for OIDC
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Never version or publish off a broken tree.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # With pending changesets: opens/updates a "version packages" PR that
      # bumps ONLY the changed packages. With none (i.e. that PR was merged):
      # runs `pnpm run release` (build + `changeset publish`), which publishes
      # ONLY the packages whose version isn't already on the registry, and tags them.
      #
      # Auth is npm Trusted Publishing (OIDC) via `id-token: write` above — no
      # NPM_TOKEN secret. This REQUIRES a trusted publisher configured on npm for
      # each package (Settings > Trusted publisher: this repo + `release.yml`),
      # which can only be done after the package's first publish. Until then, the
      # baseline goes out via scripts/first-publish.sh. Provenance is automatic
      # under trusted publishing, so no --provenance flag is needed.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
